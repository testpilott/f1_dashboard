name: snapshot-weekly

on:
  schedule:
    - cron: "30 5 * * 1"   # Monday 00:30 ET / 05:30 UTC
  workflow_dispatch: {}
  push:
    branches: [main]
    paths-ignore:
      - "data/snapshots/**"

concurrency:
  group: snapshot-weekly
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npm run snapshot:weekly
        env:
          # Background batch job: allow large payloads / slow upstream without
          # aborting on the 8 s user-request default.
          JOLPICA_FETCH_TIMEOUT_MS: "30000"
          SNAPSHOT_REQUEST_INTERVAL_MS: "1000"
      - name: commit snapshot if changed
        run: |
          git config user.name  "snapshot-bot"
          git config user.email "benlee226@gmail.com"
          git add data/snapshots/
          if git diff --cached --quiet; then
            echo "No snapshot changes."
            exit 0
          fi
          git commit -m "chore(snapshots): weekly refresh ($(date -u +%Y-%m-%d))"
          git fetch origin main
          git pull --rebase origin main
          git push origin HEAD:main
